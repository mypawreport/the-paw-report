<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:20px;background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.paw-gauge-wrap{position:relative;width:210px;height:210px;margin:4px auto 6px;display:flex;align-items:center;justify-content:center}
.paw-gauge-svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.paw-gauge-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:11}
.paw-gauge-fill{fill:none;stroke-width:11;stroke-linecap:round}
.gauge-temp-text{font-size:1.7rem;font-weight:900;letter-spacing:-0.5px;line-height:1.2;color:#fff;position:relative;z-index:2}
.rating-emoji-big{font-size:5rem !important;position:relative;z-index:2;margin-bottom:0 !important;color:#e8e0d0 !important}
.rating-pill{display:inline-block;padding:4px 18px;border-radius:999px;font-size:0.95rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#fff;margin-bottom:4px}
.gauge-sublabel{font-size:0.78rem;color:rgba(255,255,255,0.5);letter-spacing:0.5px;margin-bottom:2px}
.rating-message{font-size:0.86rem;opacity:0.8;line-height:1.5;text-align:center;color:rgba(255,255,255,0.85)}
</style>
</head>
<body>
<div class="gauge-wrap">
  <div class="paw-gauge-wrap">
    <svg class="paw-gauge-svg" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF8C00"/>
          <stop offset="100%" stop-color="#FF4500"/>
        </linearGradient>
        <radialGradient id="paw3d" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#f5ede0"/>
          <stop offset="60%" stop-color="#e8e0d0"/>
          <stop offset="100%" stop-color="#c8bea8"/>
        </radialGradient>
        <filter id="pawGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle class="paw-gauge-track" cx="100" cy="100" r="90"></circle>
      <circle class="paw-gauge-fill" cx="100" cy="100" r="90" stroke="url(#gauge-grad)" stroke-dasharray="379 566"></circle>
      <circle cx="177" cy="48" r="4" fill="#fff" stroke="rgba(0,0,0,0.3)" stroke-width="1"></circle>
    </svg>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
      <div class="gauge-temp-text">87°F</div>
      <span class="rating-emoji rating-emoji-big">
        <svg viewBox="0 0 200 200" width="1em" height="1em" style="display:inline-block;vertical-align:-0.08em" aria-hidden="true">
          <g fill="url(#paw3d)" filter="url(#pawGlow)">
            <path d="M 56,60 C 42,62 34,76 37,90 C 40,102 52,106 62,100 C 72,93 74,78 69,66 C 66,60 60,58 56,60 Z" transform="rotate(-18 52 82)"/>
            <path d="M 96,32 C 82,34 74,48 77,62 C 80,74 92,78 102,72 C 112,65 114,50 109,38 C 106,32 100,30 96,32 Z" transform="rotate(-6 92 54)"/>
            <path d="M 136,32 C 122,34 114,48 117,62 C 120,74 132,78 142,72 C 152,65 154,50 149,38 C 146,32 140,30 136,32 Z" transform="rotate(6 132 54)"/>
            <path d="M 176,60 C 162,62 154,76 157,90 C 160,102 172,106 182,100 C 192,93 194,78 189,66 C 186,60 180,58 176,60 Z" transform="rotate(18 172 82)"/>
            <path d="M 116,72 C 92,72 76,86 73,104 C 70,122 84,140 116,142 C 148,140 162,122 159,104 C 156,86 140,72 116,72 Z"/>
          </g>
          <g fill="rgba(255,255,255,0.18)">
            <ellipse cx="52" cy="78" rx="4" ry="6" transform="rotate(-18 52 82)"/>
            <ellipse cx="92" cy="50" rx="4" ry="6" transform="rotate(-6 92 54)"/>
            <ellipse cx="132" cy="50" rx="4" ry="6" transform="rotate(6 132 54)"/>
            <ellipse cx="172" cy="78" rx="4" ry="6" transform="rotate(18 172 82)"/>
            <ellipse cx="106" cy="100" rx="10" ry="7"/>
          </g>
        </svg>
      </span>
    </div>
  </div>
  <div style="text-align:center">
    <div class="rating-pill" style="background:#FF4500">HOT</div>
    <div class="gauge-sublabel">Ground Temperature</div>
    <div class="rating-message">Hot! Limit time on pavement</div>
  </div>
</div>
</body>
</html>
