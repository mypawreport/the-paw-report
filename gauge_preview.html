<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:30px;background:#0d1117;display:flex;flex-direction:column;align-items:center;gap:30px;font-family:Arial,sans-serif}
h2{color:rgba(255,255,255,0.5);font-size:0.85rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:0}
.row{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:10px}
.card img{width:160px;height:160px;border-radius:12px}
.label{color:rgba(255,255,255,0.8);font-size:0.95rem;font-weight:700}
</style>
</head>
<body>
<h2>Safe — Green #6be000</h2>
<div class="row">
  <div class="card">
    <img src="https://media.base44.com/images/public/6a1c6fbdd48b351a9eb7455e/8111df6d5_generated_image.png" alt="Safe paw">
    <div class="label">Safe</div>
  </div>
</div>
<h2>Hot — Lighter Orange #FF8C42</h2>
<div class="row">
  <div class="card">
    <img src="https://media.base44.com/images/public/6a1c6fbdd48b351a9eb7455e/dc17281d7_generated_image.png" alt="Hot paw">
    <div class="label">Hot</div>
  </div>
</div>
</body>
</html>
