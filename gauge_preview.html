<!DOCTYPE html>

<style>

.card{display:flex;flex-direction:column;align-items:center;gap:8px}
.card img{width:140px;height:140px;border-radius:12px}

</style>
</head>

<h2>Safe — #6be000</h2>
<div class="row"><div class="card"><img src="https://media.base44.com/images/public/6a1c6fbdd48b351a9eb7455e/8111df6d5_generated_image.png"><div class="label">Safe</div></div></div>

<h2>Fry Zone — #dc2626</h2>
<div class="row"><div class="card"><img src="https://media.base44.com/images/public/6a1c6fbdd48b351a9eb7455e/099a4a7cb_generated_image.png"><div class="label">Fry Zone</div></div></div>
