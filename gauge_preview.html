<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:40px;background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
.paw-container{width:200px;height:200px}
</style>
</head>
<body>
<div class="paw-container">
  <svg viewBox="0 0 200 200" width="200" height="200" style="display:block">
    <defs>
      <radialGradient id="paw3d" cx="38%" cy="28%" r="80%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="50%" stop-color="#f5ecdb"/>
        <stop offset="100%" stop-color="#d6c8a8"/>
      </radialGradient>
      <filter id="emboss">
        <feGaussianBlur stdDeviation="2" in="SourceAlpha" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="spec">
          <fePointLight x="80" y="50" z="80"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOnly"/>
        <feMerge>
          <feMergeNode in="SourceGraphic"/>
          <feMergeNode in="specOnly"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Four toe pads - clearly separated, egg/oval shaped, arranged in arc -->
    <g fill="url(#paw3d)" filter="url(#emboss)">
      <ellipse cx="42" cy="78" rx="18" ry="22" transform="rotate(-22 42 78)"/>
      <ellipse cx="78" cy="52" rx="18" ry="23" transform="rotate(-8 78 52)"/>
      <ellipse cx="122" cy="52" rx="18" ry="23" transform="rotate(8 122 52)"/>
      <ellipse cx="158" cy="78" rx="18" ry="22" transform="rotate(22 158 78)"/>
      <!-- Main palm pad - wide, rounded, clearly separated from toes -->
      <path d="M 56,120 C 56,100 78,90 100,90 C 122,90 144,100 144,120 C 144,148 124,165 100,165 C 76,165 56,148 56,120 Z"/>
    </g>

    <!-- Subtle highlight on each pad for 3D pop -->
    <g fill="rgba(255,255,255,0.4)" opacity="0.7">
      <ellipse cx="38" cy="72" rx="7" ry="8" transform="rotate(-22 42 78)"/>
      <ellipse cx="74" cy="46" rx="7" ry="8" transform="rotate(-8 78 52)"/>
      <ellipse cx="118" cy="46" rx="7" ry="8" transform="rotate(8 122 52)"/>
      <ellipse cx="154" cy="72" rx="7" ry="8" transform="rotate(22 158 78)"/>
      <ellipse cx="86" cy="108" rx="18" ry="10"/>
    </g>
  </svg>
</div>
</body>
</html>
